name: FFmpeg Corresponding Source Audit

on:
  pull_request:
    paths:
      - "scripts/ffmpeg-sidecars.json"
      - "scripts/package-ffmpeg-corresponding-source.sh"
      - "scripts/repack-source-archive.sh"
      - "scripts/repack-source-directory.sh"
      - "scripts/archive-source-tree.sh"
      - "scripts/sanitize-source-tree.sh"
      - "scripts/test-source-repacker.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve immutable source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          archive_name="$(jq -er '.correspondingSource.archiveName' scripts/ffmpeg-sidecars.json)"
          archive_sha256="$(jq -er '.correspondingSource.archiveSha256' scripts/ffmpeg-sidecars.json)"
          asset_tag="$(jq -er '.correspondingSource.assetTag' scripts/ffmpeg-sidecars.json)"
          engine_id="$(jq -er '.engine.id' scripts/ffmpeg-sidecars.json)"
          build_commit="$(jq -er '.correspondingSource.buildCommit' scripts/ffmpeg-sidecars.json)"
          toolchain_digest="$(jq -er '.correspondingSource.sourceToolchainImage' scripts/ffmpeg-sidecars.json | sed -E 's/^.+@sha256://')"
          [[ "$archive_name" =~ ^vidmetry-ffmpeg-[A-Za-z0-9.-]+-corresponding-source\.tar\.xz$ ]]
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$asset_tag" =~ ^ffmpeg-source-[A-Za-z0-9.-]+$ ]]
          [[ "$engine_id" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$build_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$toolchain_digest" =~ ^[0-9a-f]{64}$ ]]
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "asset_tag=$asset_tag" >> "$GITHUB_OUTPUT"
          echo "cache_key=ffmpeg-source-v1-$engine_id-$build_commit-$toolchain_digest" >> "$GITHUB_OUTPUT"

      - name: Reuse existing immutable source release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_NAME: ${{ steps.source.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ steps.source.outputs.archive_sha256 }}
          ASSET_TAG: ${{ steps.source.outputs.asset_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$ASSET_TAG" >/dev/null 2>&1; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p release-assets
          gh release download "$ASSET_TAG" \
            --pattern "$ARCHIVE_NAME" \
            --pattern "$ARCHIVE_NAME.sha256" \
            --dir release-assets
          (cd release-assets && sha256sum --check "$ARCHIVE_NAME.sha256")
          test "$(sha256sum "release-assets/$ARCHIVE_NAME" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA256"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Restore pinned dependency sources
        id: source-cache
        if: steps.existing.outputs.available != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ffmpeg-source-downloads
          key: ${{ steps.source.outputs.cache_key }}

      - name: Assemble complete corresponding source
        id: assemble
        if: steps.existing.outputs.available != 'true'
        continue-on-error: true
        shell: bash
        env:
          SOURCE_ARCHIVE_NAME: ${{ steps.source.outputs.archive_name }}
        run: |
          scripts/test-source-repacker.sh
          scripts/package-ffmpeg-corresponding-source.sh \
            --cache-dir .cache/ffmpeg-source-downloads \
            --output "release-assets/$SOURCE_ARCHIVE_NAME"

      - name: Inspect source acquisition cache
        id: cache-state
        if: always() && steps.existing.outputs.available != 'true'
        shell: bash
        run: |
          if [[ -s .cache/ffmpeg-source-downloads/.vidmetry-source-cache-v1 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save complete dependency-source cache
        if: always() && steps.source-cache.outputs.cache-hit != 'true' && steps.cache-state.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ffmpeg-source-downloads
          key: ${{ steps.source.outputs.cache_key }}

      - name: Enforce source assembly result
        if: steps.existing.outputs.available != 'true' && steps.assemble.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Inspect source archive completeness
        shell: bash
        env:
          SOURCE_ARCHIVE_NAME: ${{ steps.source.outputs.archive_name }}
          SOURCE_ARCHIVE_SHA256: ${{ steps.source.outputs.archive_sha256 }}
        run: |
          test -s "release-assets/$SOURCE_ARCHIVE_NAME"
          test -s "release-assets/$SOURCE_ARCHIVE_NAME.sha256"
          (cd release-assets && sha256sum --check "$SOURCE_ARCHIVE_NAME.sha256")
          test "$(sha256sum "release-assets/$SOURCE_ARCHIVE_NAME" | cut -d ' ' -f 1)" = "$SOURCE_ARCHIVE_SHA256"
          tar -tf "release-assets/$SOURCE_ARCHIVE_NAME" > source-archive-files.txt
          grep -q '/ffmpeg/fftools/ffmpeg.c$' source-archive-files.txt
          grep -q '/build-scripts/build.sh$' source-archive-files.txt
          grep -q '/build-scripts/Dockerfile.vidmetry-source-graph$' source-archive-files.txt
          grep -q '/SOURCE_METADATA.json$' source-archive-files.txt
          test "$(grep -c '/build-scripts/.cache/downloads/.*\.tar\.xz$' source-archive-files.txt)" -ge 20
