name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      archive_name: ${{ steps.source.outputs.archive_name }}
      archive_sha256: ${{ steps.source.outputs.archive_sha256 }}
      asset_tag: ${{ steps.source.outputs.asset_tag }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify privacy boundary
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: ./scripts/privacy-guard.ps1 -Mode Repository -Revision $env:RELEASE_COMMIT -RefName $env:RELEASE_REF

      - name: Synchronize release version from tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/set-release-version.ps1 -Tag $env:RELEASE_TAG

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-release-version.ps1 -Tag $env:RELEASE_TAG

      - name: Verify public distribution boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$RELEASE_REPOSITORY" --jq '.visibility')"
          if [[ "$visibility" != "public" ]]; then
            echo 'The repository is not public, so equivalent no-charge source access cannot be guaranteed.' >&2
            exit 1
          fi

      - name: Resolve and verify immutable source Release
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive_name="$(jq -er '.correspondingSource.archiveName' scripts/ffmpeg-sidecars.json)"
          archive_sha256="$(jq -er '.correspondingSource.archiveSha256' scripts/ffmpeg-sidecars.json)"
          asset_tag="$(jq -er '.correspondingSource.assetTag' scripts/ffmpeg-sidecars.json)"
          [[ "$archive_name" =~ ^vidmetry-ffmpeg-[A-Za-z0-9.-]+-corresponding-source\.tar\.xz$ ]]
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$asset_tag" =~ ^ffmpeg-source-[A-Za-z0-9.-]+$ ]]
          test "$(gh release view "$asset_tag" --json isDraft --jq '.isDraft')" = 'false'
          asset_names="$(gh release view "$asset_tag" --json assets --jq '.assets[].name')"
          grep -Fxq "$archive_name" <<< "$asset_names"
          grep -Fxq "$archive_name.sha256" <<< "$asset_names"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "asset_tag=$asset_tag" >> "$GITHUB_OUTPUT"

      - name: Audit Rust licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: licenses
          manifest-path: src-tauri/Cargo.toml

  source-assets:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download immutable corresponding source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_NAME: ${{ needs.preflight.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ needs.preflight.outputs.archive_sha256 }}
          ASSET_TAG: ${{ needs.preflight.outputs.asset_tag }}
        run: |
          set -euo pipefail
          mkdir -p source-assets
          gh release download "$ASSET_TAG" \
            --pattern "$ARCHIVE_NAME" \
            --pattern "$ARCHIVE_NAME.sha256" \
            --dir source-assets
          (cd source-assets && sha256sum --check "$ARCHIVE_NAME.sha256")
          actual_sha256="$(sha256sum "source-assets/$ARCHIVE_NAME" | cut -d ' ' -f 1)"
          [[ "$actual_sha256" == "$ARCHIVE_SHA256" ]]
          tar -tf "source-assets/$ARCHIVE_NAME" > source-archive-files.txt
          grep -q '/ffmpeg/fftools/ffmpeg.c$' source-archive-files.txt
          grep -q '/build-scripts/build.sh$' source-archive-files.txt
          grep -q '/SOURCE_METADATA.json$' source-archive-files.txt

      - name: Transfer verified source to publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: immutable-ffmpeg-source
          path: source-assets
          compression-level: 0
          retention-days: 1

  build-windows:
    needs: preflight
    environment: microsoft-store-release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Synchronize release version from tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/set-release-version.ps1 -Tag $env:RELEASE_TAG

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.18.0

      - name: Verify pinned Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: windows-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript dependencies and licenses
        run: |
          npm audit --audit-level=high
          npm run check:licenses

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Prepare verified distribution dependencies
        shell: pwsh
        run: |
          ./scripts/setup-ffmpeg.ps1
          ./scripts/setup-copyleft-sources.ps1
          ./scripts/generate-third-party-licenses.ps1

      - name: Verify distribution contracts and frontend
        run: npm run verify

      - name: Verify desktop UI
        run: npm run test:ui

      - name: Verify Rust backend
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Verify media exports
        run: npm run test:integration

      - name: Build application once
        run: npm run tauri build -- --no-bundle

      - name: Build Microsoft Store MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          foreach ($name in @('MSIX_IDENTITY_NAME', 'MSIX_PUBLISHER', 'MSIX_PUBLISHER_DISPLAY_NAME')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Repository variable $name must match the reserved Partner Center identity."
            }
          }
          ./scripts/build-msix.ps1 `
            -IdentityName $env:MSIX_IDENTITY_NAME `
            -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME `
            -SkipAppBuild

      - name: Verify Microsoft Store MSIX
        run: npm run test:msix

      - name: Build GitHub NSIS
        run: npm run nsis:build

      - name: Verify GitHub NSIS
        run: npm run test:nsis -- --LiveInstall

      - name: Stage Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-assets | Out-Null
          $msix = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/msix' -Filter '*.msix' -File)
          $nsisPath = 'src-tauri/target/release/bundle/nsis/Vidmetry_x64-setup.exe'
          if ($msix.Count -ne 1 -or -not (Test-Path -LiteralPath $nsisPath -PathType Leaf)) {
            throw "Expected one MSIX and the fixed-name NSIS package $nsisPath."
          }
          Copy-Item -LiteralPath $msix[0].FullName -Destination windows-assets
          Copy-Item -LiteralPath $nsisPath -Destination windows-assets

      - name: Transfer Windows packages to publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packages
          path: windows-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [preflight, source-assets, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: immutable-ffmpeg-source
          path: release-assets

      - name: Download Windows packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-packages
          path: release-assets

      - name: Reverify publication assets
        shell: bash
        env:
          ARCHIVE_NAME: ${{ needs.preflight.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ needs.preflight.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check "$ARCHIVE_NAME.sha256")
          actual_sha256="$(sha256sum "release-assets/$ARCHIVE_NAME" | cut -d ' ' -f 1)"
          [[ "$actual_sha256" == "$ARCHIVE_SHA256" ]]
          test "$(find release-assets -maxdepth 1 -type f -name '*.msix' | wc -l)" -eq 1
          test -f release-assets/Vidmetry_x64-setup.exe
          test "$(find release-assets -maxdepth 1 -type f -name '*-setup.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.msi' | wc -l)" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1

      - name: Publish complete Release atomically
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_NAME: ${{ needs.preflight.outputs.archive_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'Release tag is missing.' }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) { throw 'A published Release already exists for this tag.' }
          } else {
            $createArguments = @(
              'release', 'create', $tag,
              '--draft',
              '--verify-tag',
              '--title', "Vidmetry $tag",
              '--generate-notes',
              '--notes', 'The unsigned Windows x64 NSIS setup is provided for direct installation and may show a SmartScreen warning. The MSIX is the verified Microsoft Store submission package and receives its production signature from Microsoft Store. The exact FFmpeg Complete Corresponding Source and its SHA-256 are attached beside both packages.'
            )
            if ($tag.Contains('-', [StringComparison]::Ordinal)) { $createArguments += '--prerelease' }
            & gh @createArguments
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the draft Release.' }
          }

          $assets = @(Get-ChildItem -LiteralPath 'release-assets' -File | ForEach-Object FullName)
          if ($assets.Count -ne 4) { throw "Expected four publication assets but found $($assets.Count)." }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload complete Release assets.' }

          $release = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Release was published before its assets were verified.' }
          $assetNames = @($release.assets | ForEach-Object name)
          $expectedNames = @($assets | ForEach-Object { Split-Path -Leaf $_ } | Sort-Object)
          $actualNames = @($assetNames | Sort-Object)
          if (($actualNames -join "`n") -cne ($expectedNames -join "`n")) {
            throw "Draft Release assets differ from the four verified local assets: $($actualNames -join ', ')."
          }
          foreach ($required in @($env:ARCHIVE_NAME, "$($env:ARCHIVE_NAME).sha256")) {
            if ($required -notin $assetNames) { throw "Draft Release is missing $required." }
          }
          if (@($assetNames | Where-Object { $_ -match '\.msix$' }).Count -ne 1 -or
              @($assetNames | Where-Object { $_ -ceq 'Vidmetry_x64-setup.exe' }).Count -ne 1 -or
              @($assetNames | Where-Object { $_ -match '\.msi$' }).Count -ne 0) {
            throw 'Draft Release must contain exactly one MSIX and one NSIS setup EXE, with no MSI.'
          }

          $visibility = (& gh api "repos/$env:RELEASE_REPOSITORY" --jq '.visibility').Trim()
          if ($LASTEXITCODE -ne 0 -or $visibility -cne 'public') {
            throw 'Public repository access could not be confirmed immediately before publication.'
          }

          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the verified draft Release.' }
