[package]
name = "vidmetry"
version = "0.4.8"
description = "A focused desktop video cropper"
authors = ["Vidmetry contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/automachete/vidmetry"

[lib]
name = "vidmetry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.33"
notify = "8.2.0"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-store = "2.4.4"
uuid = { version = "1.24.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.61.2"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_UI_Shell"] }
winreg = "0.55.0"
